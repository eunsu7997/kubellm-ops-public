# Same trial Gateway with the latest metrics image (reason-labelled readiness failures), pulled from a loopback-only registry.
# Tag operations-20261021 == sha256:4cbddb89... (the Docker Compose Gateway image). Needs the registry on 127.0.0.1:5005.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kubellm-gateway-trial-config
  namespace: kubellm-gpu-validation
data:
  VLLM_BASE_URL: http://kubellm-vllm-trial:8000
  MODEL_NAME: Qwen/Qwen2.5-0.5B-Instruct
  REQUEST_TIMEOUT: '30'
  READINESS_MODE: inference
  READINESS_TIMEOUT: '2'
  READINESS_CACHE_SECONDS: '5'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubellm-gateway-trial
  namespace: kubellm-gpu-validation
  labels:
    app: kubellm-gateway-trial
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubellm-gateway-trial
  template:
    metadata:
      labels:
        app: kubellm-gateway-trial
    spec:
      containers:
      - name: gateway
        image: localhost:5005/kubellm-ops-gateway:operations-20261021
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: kubellm-gateway-trial-config
        startupProbe:
          httpGet:
            path: /healthz
            port: 8000
          periodSeconds: 5
          failureThreshold: 6
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8000
          initialDelaySeconds: 2
          timeoutSeconds: 4
          periodSeconds: 5
          failureThreshold: 2
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8000
          periodSeconds: 10
          failureThreshold: 3
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
      automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: kubellm-gateway-trial
  namespace: kubellm-gpu-validation
spec:
  type: ClusterIP
  selector:
    app: kubellm-gateway-trial
  ports:
  - port: 8000
    targetPort: 8000
    name: http
