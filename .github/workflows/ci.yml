name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, Node 24
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, Node 24
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: pytest
        run: pytest -q

      - name: Validate YAML syntax (k8s manifests, monitoring configs, compose)
        run: |
          python -c "
          import sys, yaml
          from pathlib import Path
          files = [f for f in list(Path('.').rglob('*.yml')) + list(Path('.').rglob('*.yaml')) if '.venv' not in f.parts and '.git' not in f.parts]
          ok = True
          for f in files:
              try:
                  list(yaml.safe_load_all(f.read_text(encoding='utf-8')))
                  print(f'OK   {f}')
              except Exception as e:
                  ok = False
                  print(f'FAIL {f}: {e}')
          sys.exit(0 if ok else 1)
          "

  # GPU/Kubernetes가 필요한 검증(Docker build, kubectl apply, vLLM 실행 등)은 GitHub-hosted
  # runner에 GPU와 클러스터가 없어 여기서 돌리지 않는다. 검증 범위는 README의 "검증 범위" 표에,
  # 실제 실행 기록은 docs/KUBERNETES-LIVE-VALIDATION.md와 scripts/failure-tests/ 에 있다.
