# Isolated CUDA smoke test for the existing Ubuntu-24.04 WSL k3s cluster.
# Use explicit WSL k3s commands; do not apply the entire k8s directory.
apiVersion: v1
kind: Namespace
metadata:
  name: kubellm-gpu-validation
  labels:
    app.kubernetes.io/part-of: kubellm-ops
---
apiVersion: v1
kind: Pod
metadata:
  name: kubellm-cuda-smoke
  namespace: kubellm-gpu-validation
  labels:
    app.kubernetes.io/part-of: kubellm-ops
    app.kubernetes.io/name: cuda-smoke
spec:
  restartPolicy: Never
  activeDeadlineSeconds: 120
  runtimeClassName: nvidia
  containers:
    - name: compute
      image: pytorch/pytorch@sha256:68c022c2f4627943a6f3e574cfd2c8ae4256210d5f66ae2b117942e0a8d4fa9d
      imagePullPolicy: IfNotPresent
      command: [python, -c]
      args:
        - |
          import torch
          assert torch.cuda.is_available(), 'CUDA unavailable'
          print('torch_version=', torch.__version__, flush=True)
          print('device_count=', torch.cuda.device_count(), flush=True)
          print('device_name=', torch.cuda.get_device_name(0), flush=True)
          x = torch.arange(1024, device='cuda', dtype=torch.float32)
          y = x + 1
          torch.cuda.synchronize()
          assert y[-1].item() == 1024
          print('result_last=', y[-1].item(), flush=True)
          print('CUDA vector addition PASSED', flush=True)
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 1Gi
          nvidia.com/gpu: 1
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
