apiVersion: v1
kind: ConfigMap
metadata:
  name: kubellm-prometheus-trial-config
  namespace: kubellm-gpu-validation
data:
  prometheus.yml: "global:\n  scrape_interval: 5s\nscrape_configs:\n- job_name: gateway\n\
    \  static_configs:\n  - targets:\n    - kubellm-gateway-trial:8000\n- job_name:\
    \ vllm\n  static_configs:\n  - targets:\n    - kubellm-vllm-trial:8000\n- job_name:\
    \ dcgm\n  static_configs:\n  - targets:\n    - kubellm-dcgm-trial:9400\n"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubellm-prometheus-trial
  namespace: kubellm-gpu-validation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubellm-prometheus-trial
  template:
    metadata:
      labels:
        app: kubellm-prometheus-trial
    spec:
      automountServiceAccountToken: false
      containers:
      - name: kubellm-prometheus-trial
        image: prom/prometheus:v2.55.1
        imagePullPolicy: Never
        ports:
        - containerPort: 9090
        volumeMounts:
        - name: config
          mountPath: /etc/prometheus
          readOnly: true
        - name: data
          mountPath: /prometheus
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        args:
        - --config.file=/etc/prometheus/prometheus.yml
        - --storage.tsdb.path=/prometheus
        - --storage.tsdb.retention.time=2h
      volumes:
      - name: config
        configMap:
          name: kubellm-prometheus-trial-config
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: kubellm-prometheus-trial
  namespace: kubellm-gpu-validation
spec:
  type: ClusterIP
  selector:
    app: kubellm-prometheus-trial
  ports:
  - name: http
    port: 9090
    targetPort: 9090
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kubellm-grafana-trial-config
  namespace: kubellm-gpu-validation
data:
  datasources.yaml: "apiVersion: 1\ndatasources:\n- name: Prometheus\n  uid: prometheus\n\
    \  type: prometheus\n  access: proxy\n  url: http://kubellm-prometheus-trial:9090\n\
    \  isDefault: true\n"
  dashboards.yaml: "apiVersion: 1\nproviders:\n- name: kubellm-wsl-validation\n  orgId:\
    \ 1\n  type: file\n  disableDeletion: true\n  options:\n    path: /var/lib/grafana/dashboards\n"
  dashboard.json: '{"id": null, "uid": "kubellm-wsl-gpu-observed", "title": "KubeLLM-Ops
    WSL GPU — Observed Validation", "description": "Gateway metrics and vLLM names
    observed in saved Docker evidence. Isolated samples do not verify complete time
    series or benchmark performance. Kubernetes GPU and DCGM remain NOT VERIFIED.
    Source changes have not been deployed.", "schemaVersion": 39, "version": 1, "editable":
    true, "timezone": "browser", "time": {"from": "now-1h", "to": "now"}, "refresh":
    "10s", "tags": ["kubellm-ops"], "panels": [{"id": 1, "type": "timeseries", "title":
    "API Request Rate (VERIFIED metric name)", "description": "gateway_requests_total은
    gateway/app/metrics.py에 정의된 실제 metric.", "gridPos": {"x": 0, "y": 0, "w": 12,
    "h": 7}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets":
    [{"expr": "sum(rate(gateway_requests_total[5m]))", "legendFormat": "requests/sec"}]},
    {"id": 2, "type": "timeseries", "title": "Error Rate (VERIFIED metric name)",
    "description": "gateway_requests_error_total (status 라벨별).", "gridPos": {"x":
    12, "y": 0, "w": 12, "h": 7}, "datasource": {"type": "prometheus", "uid": "prometheus"},
    "targets": [{"expr": "sum(rate(gateway_requests_error_total[5m])) by (status)",
    "legendFormat": "{{status}}"}]}, {"id": 3, "type": "timeseries", "title": "P95
    Latency - Gateway (VERIFIED metric name)", "description": "gateway_request_latency_seconds
    histogram.", "gridPos": {"x": 0, "y": 7, "w": 12, "h": 7}, "datasource": {"type":
    "prometheus", "uid": "prometheus"}, "fieldConfig": {"defaults": {"unit": "s"},
    "overrides": []}, "targets": [{"expr": "histogram_quantile(0.95, sum(rate(gateway_request_latency_seconds_bucket[5m]))
    by (le))", "legendFormat": "p95"}]}, {"id": 4, "type": "timeseries", "title":
    "Backend Failures by Reason (VERIFIED metric name)", "description": "gateway_backend_failures_total{reason=...}
    — connection_error/timeout/backend_5xx/http_error.", "gridPos": {"x": 12, "y":
    7, "w": 12, "h": 7}, "datasource": {"type": "prometheus", "uid": "prometheus"},
    "targets": [{"expr": "sum(rate(gateway_backend_failures_total[5m])) by (reason)",
    "legendFormat": "{{reason}}"}]}, {"id": 5, "type": "timeseries", "title": "vLLM
    TTFT p95 (observed in WSL k3s vLLM 0.30.0)", "description": "Observed Docker vLLM
    0.30.0 histogram; tiny-sample p95 is a bucket estimate, not a benchmark.", "gridPos":
    {"x": 0, "y": 14, "w": 12, "h": 7}, "datasource": {"type": "prometheus", "uid":
    "prometheus"}, "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []}, "targets":
    [{"expr": "histogram_quantile(0.95, sum(rate(vllm:time_to_first_token_seconds_bucket[5m]))
    by (le))", "legendFormat": "TTFT p95"}]}, {"id": 6, "type": "timeseries", "title":
    "vLLM TPOT p95 (observed in WSL k3s vLLM 0.30.0)", "description": "Observed Docker
    vLLM 0.30.0 histogram; tiny-sample p95 is a bucket estimate, not a benchmark.",
    "gridPos": {"x": 12, "y": 14, "w": 12, "h": 7}, "datasource": {"type": "prometheus",
    "uid": "prometheus"}, "fieldConfig": {"defaults": {"unit": "s"}, "overrides":
    []}, "targets": [{"expr": "histogram_quantile(0.95, sum(rate(vllm:request_time_per_output_token_seconds_bucket[5m]))
    by (le))", "legendFormat": "TPOT p95"}]}, {"id": 7, "type": "timeseries", "title":
    "vLLM Throughput - generation tokens/sec (observed in WSL k3s vLLM 0.30.0)", "description":
    "vllm:generation_tokens_total", "gridPos": {"x": 0, "y": 21, "w": 12, "h": 7},
    "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr":
    "sum(rate(vllm:generation_tokens_total[5m]))", "legendFormat": "tokens/sec"}]},
    {"id": 8, "type": "timeseries", "title": "vLLM Queue / Waiting Requests (observed
    in WSL k3s vLLM 0.30.0)", "description": "Observed gauges vllm:num_requests_waiting
    and vllm:num_requests_running were 0 at idle. Queue behavior under load is NOT
    VERIFIED; keep engine/model labels when inspecting series.", "gridPos": {"x":
    12, "y": 21, "w": 12, "h": 7}, "datasource": {"type": "prometheus", "uid": "prometheus"},
    "targets": [{"expr": "vllm:num_requests_waiting", "legendFormat": "waiting"},
    {"expr": "vllm:num_requests_running", "legendFormat": "running"}]}, {"id": 9,
    "type": "timeseries", "title": "vLLM KV Cache Usage % (observed in WSL k3s vLLM
    0.30.0)", "description": "Saved HELP defines 1 as 100 percent, so multiply by
    100 for Grafana percent units. Observed idle value 0; utilization under load is
    NOT VERIFIED. This is KV cache occupancy, not total GPU memory usage.", "gridPos":
    {"x": 0, "y": 28, "w": 12, "h": 7}, "datasource": {"type": "prometheus", "uid":
    "prometheus"}, "fieldConfig": {"defaults": {"unit": "percent"}, "overrides": []},
    "targets": [{"expr": "vllm:kv_cache_usage_perc * 100", "legendFormat": "kv cache
    %"}]}, {"id": 12, "type": "timeseries", "title": "GPU Utilization % (observed
    DCGM / WSL)", "description": "DCGM_FI_DEV_GPU_UTIL", "gridPos": {"x": 12, "y":
    28, "w": 12, "h": 7}, "datasource": {"type": "prometheus", "uid": "prometheus"},
    "fieldConfig": {"defaults": {"unit": "percent"}, "overrides": []}, "targets":
    [{"expr": "DCGM_FI_DEV_GPU_UTIL", "legendFormat": "GPU {{gpu}}"}]}, {"id": 13,
    "type": "timeseries", "title": "GPU Memory Used (observed DCGM / WSL)", "description":
    "DCGM_FI_DEV_FB_USED", "gridPos": {"x": 0, "y": 35, "w": 12, "h": 7}, "datasource":
    {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "DCGM_FI_DEV_FB_USED",
    "legendFormat": "GPU {{gpu}}"}]}, {"id": 14, "type": "timeseries", "title": "GPU
    Temperature (observed DCGM / WSL)", "description": "DCGM_FI_DEV_GPU_TEMP", "gridPos":
    {"x": 12, "y": 35, "w": 12, "h": 7}, "datasource": {"type": "prometheus", "uid":
    "prometheus"}, "fieldConfig": {"defaults": {"unit": "celsius"}, "overrides": []},
    "targets": [{"expr": "DCGM_FI_DEV_GPU_TEMP", "legendFormat": "GPU {{gpu}}"}]},
    {"id": 15, "type": "timeseries", "title": "GPU Power (NOT EXPOSED in this run)",
    "description": "DCGM_FI_DEV_POWER_USAGE", "gridPos": {"x": 0, "y": 42, "w": 12,
    "h": 7}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "fieldConfig":
    {"defaults": {"unit": "watt"}, "overrides": []}, "targets": [{"expr": "DCGM_FI_DEV_POWER_USAGE",
    "legendFormat": "GPU {{gpu}}"}]}]}'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubellm-grafana-trial
  namespace: kubellm-gpu-validation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubellm-grafana-trial
  template:
    metadata:
      labels:
        app: kubellm-grafana-trial
    spec:
      automountServiceAccountToken: false
      containers:
      - name: kubellm-grafana-trial
        image: grafana/grafana:11.2.0
        imagePullPolicy: Never
        ports:
        - containerPort: 3000
        volumeMounts:
        - name: config
          mountPath: /etc/grafana/provisioning/datasources/datasources.yaml
          subPath: datasources.yaml
          readOnly: true
        - name: config
          mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml
          subPath: dashboards.yaml
          readOnly: true
        - name: config
          mountPath: /var/lib/grafana/dashboards/dashboard.json
          subPath: dashboard.json
          readOnly: true
        - name: data
          mountPath: /var/lib/grafana
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        env:
        - name: GF_AUTH_ANONYMOUS_ENABLED
          value: 'false'
        - name: GF_SECURITY_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: kubellm-grafana-trial-auth
              key: admin-password
      volumes:
      - name: config
        configMap:
          name: kubellm-grafana-trial-config
      - name: data
        emptyDir: {}
      securityContext:
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
---
apiVersion: v1
kind: Service
metadata:
  name: kubellm-grafana-trial
  namespace: kubellm-gpu-validation
spec:
  type: ClusterIP
  selector:
    app: kubellm-grafana-trial
  ports:
  - name: http
    port: 3000
    targetPort: 3000
