# NOT VERIFIED: GPU가 있는 실제 Kubernetes 클러스터에서 배포/확인하지 못했다.
# DCGM Exporter: GPU 노드마다 하나씩 떠서 사용률·VRAM·온도를 노출한다(DaemonSet).
# 실제 WSL k3s에서 적용한 버전은 k8s/validation/wsl-dcgm-trial.yaml.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: dcgm-exporter
  namespace: kubellm-ops
  labels:
    app: dcgm-exporter
spec:
  selector:
    matchLabels:
      app: dcgm-exporter
  template:
    metadata:
      labels:
        app: dcgm-exporter
    spec:
      # GPU가 달린 노드에서만 뜨도록 제한한다 (클러스터에 맞게 라벨을 조정해야 한다).
      nodeSelector:
        nvidia.com/gpu.present: "true"
      containers:
        - name: dcgm-exporter
          image: nvcr.io/nvidia/k8s/dcgm-exporter:3.3.5-3.4.1-ubuntu22.04
          ports:
            - name: metrics
              containerPort: 9400
          resources:
            limits:
              nvidia.com/gpu: 1
          securityContext:
            runAsNonRoot: false  # DCGM은 GPU 장치 접근을 위해 privileged에 가까운 권한이 필요하다
---
apiVersion: v1
kind: Service
metadata:
  name: dcgm-exporter
  namespace: kubellm-ops
spec:
  selector:
    app: dcgm-exporter
  ports:
    - name: metrics
      port: 9400
      targetPort: 9400
