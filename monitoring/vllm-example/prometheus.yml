# Private Docker DNS targets; runtime UP observations are in the Oct 21 evidence.
# Full stack recreation remains separate from the gateway-only cutover rehearsal.
# DCGM and Kubernetes exporters are absent, so no scrape jobs are declared here.
global:
  scrape_interval: 5s
  evaluation_interval: 5s
scrape_configs:
  - job_name: gateway
    static_configs:
      - targets: ["gateway:8000"]
  - job_name: vllm
    static_configs:
      - targets: ["vllm:8000"]
