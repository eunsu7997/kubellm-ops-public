services:
  mock-backend:
    build: ./mock-backend
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      - MOCK_SLOW_DELAY_SECONDS=5

  gateway:
    build: ./gateway
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - VLLM_BASE_URL=http://mock-backend:8001
      - MODEL_NAME=mock-model
      - REQUEST_TIMEOUT=30
    depends_on:
      - mock-backend

  # NOT VERIFIED: 이 두 서비스는 Docker가 없는 환경에서 작성만 했다 (docker compose up으로
  # 실행/확인하지 못했다). vLLM/DCGM-exporter/kube-state-metrics는 로컬 compose 환경에는
  # 없으므로, prometheus.yml의 해당 scrape target은 이 compose 스택에서는 항상 down으로
  # 보인다 — 그건 정상이다(그 지표들은 실제 Kubernetes+GPU 배포에서만 채워진다).
  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - gateway

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${KUBELLM_GRAFANA_PASSWORD:?Set a local Grafana password}
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
