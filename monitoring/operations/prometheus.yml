global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files:
  - /etc/prometheus/alerts.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
scrape_configs:
  - job_name: gateway
    static_configs:
      - targets: [gateway:8000]
  - job_name: vllm
    static_configs:
      - targets: [vllm:8000]
