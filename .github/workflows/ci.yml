name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, Node 24
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, Node 24
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: pytest
        run: pytest -q

      - name: Validate YAML syntax (k8s manifests, monitoring configs, compose)
        run: |
          python -c "
          import sys, yaml
          from pathlib import Path
          files = [f for f in list(Path('.').rglob('*.yml')) + list(Path('.').rglob('*.yaml')) if '.venv' not in f.parts and '.git' not in f.parts]
          ok = True
          for f in files:
              try:
                  list(yaml.safe_load_all(f.read_text(encoding='utf-8')))
                  print(f'OK   {f}')
              except Exception as e:
                  ok = False
                  print(f'FAIL {f}: {e}')
          sys.exit(0 if ok else 1)
          "

  # GPU/Kubernetes가 필요한 검증(Docker build, docker compose, kubectl apply, vLLM 실행 등)은
  # 일반 GitHub-hosted runner에는 GPU가 없고 Kubernetes 클러스터도 없으므로 여기서 억지로
  # 돌리지 않는다. 그 항목들은 README의 VERIFIED/NOT VERIFIED 표에 명시하고,
  # docs/gpu-verification.md 및 scripts/failure-tests/scenario{1,3,4}_*.sh 로 사용자가
  # 실제 클러스터에서 직접 검증하도록 안내한다.
